[build-system]
requires = ["setuptools>61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snipeit-cli"
version = "0.1.0"
description = "A command-line interface for managing and querying Snipe-IT inventory and assets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Lisa Jacklin-Wyatt"}
]
keywords = ["snipeit", "inventory", "assets", "cli", "it-management", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "typer>=0.9.0",
    "requests>=2.28.0",
    "rich>=13.0.0"
]

[project.scripts]
snipeit = "snipeit:app"

[project.urls]
Homepage = "https://github.com/LisaJacklin/SnipeIT-CLI"
Repository = "https://github.com/LisaJacklin/SnipeIT-CLI"
"Bug Tracker" = "https://github.com/LisaJacklin/SnipeIT-CLI/issues"

[tool.setuptools]
py-modules = ["snipeit"]


